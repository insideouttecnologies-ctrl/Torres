spring.application.name=Torres
server.port=${PORT:8080}

# ==========================================
# DATABASE
# ==========================================

DB_HOST=mysql-4f31963-insideouttecnologies-078c.d.aivencloud.com
DB_PORT=10592
DB_NAME=torres
DB_USERNAME=avnadmin
DB_PASSWORD=${DB_PASSWORD:}

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# THYMELEAF
# ==========================================

spring.thymeleaf.check-template-location=false

# ==========================================
# ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# ==========================================
# JWT
# ==========================================

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

api.security.token.secret=${API_SECURITY_TOKEN_SECRET}

# ==========================================
# LOGGING
# ==========================================

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG