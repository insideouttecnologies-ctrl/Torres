spring.application.name=Torres
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/torres?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.check-template-location=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

app.jwt.secret=${APP_JWT_SECRET:8f4c9e7a2b6d1f3c9a8e5b7d2c4f6a1e9b3d7c5f8a2e6b4d9c1f7a5e3b8d6}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:8f4c9e7a2b6d1f3c9a8e5b7d2c4f6a1e9b3d7c5f8a2e6b4d9c1f7a5e3b8d6}

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG